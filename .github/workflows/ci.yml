name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Writing, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:writing
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Build, HTML validation, accessibility, Lighthouse
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test
        env:
          PUBLIC_SITE_URL: https://mjwalsh.net
      - run: npm run check:html
      - run: npm run check:contrast
      - run: npm run test:a11y
        env:
          CI: "true"
      - run: npm run test:e2e
        env:
          CI: "true"
      - run: npm run lhci
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results
            .lighthouseci
          retention-days: 7
